name: sealed-lab-ci
on:
  push:
  pull_request:
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Sensitive-file guard
        run: python3 lab/bin/check-repo-hygiene.py
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Shellcheck
        run: shellcheck lab/bin/*.sh lab/proxy/entrypoint.sh lab/mock/target-entrypoint.sh lab/telemetry/entrypoint.sh
      - name: Compose validation
        run: RUN_ID=ci docker compose -f lab/compose.yaml config --quiet
